<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS reports every env(safe-area-inset-*)
         as 0, so the notch and home-indicator padding in the CSS did nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Reading passages are full of years, dates and figures. iOS detects those
         and wraps them in its own links, which renders them blue and underlined
         inside the question text. This turns that off. -->
    <meta name="format-detection"
          content="telephone=no,date=no,address=no,email=no" />
    <title>LightBluePrep · Free SAT question bank</title>
    <!-- Google Search Console ownership check. Must stay in the static HTML. -->
    <meta name="google-site-verification" content="9FGl19iXzFVxJPeSVK5IE1i-j2XEEr_U7NJkp4Hy1QQ" />
    <!-- There was no icon link at all before this, so the browser asked for
         /favicon.ico, got nothing, and showed the blank page glyph. The SVG
         carries its own light and dark fills; see the comment inside it. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google Search shows a favicon beside the result; it wants a raster
         icon in a multiple of 48px, so these sit next to the SVG. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen: name, icons and a full-screen window. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews. Discord, Slack, iMessage and the rest fetch the page
         with a plain crawler that does not run JavaScript, so these have to sit
         in the static HTML; nothing React sets at runtime is ever seen. og:image
         has to be an absolute URL because the crawler fetches it as a separate
         request with no page to resolve a relative path against, which also
         means a fork on another domain has to edit these three URLs.
         twitter:card is what makes the image render full width rather than as a
         thumbnail, and Discord honours it despite the name. -->
    <meta name="description"
          content="Every question in College Board's official SAT Question Bank, free. Filter by topic, hide the ones you've done, re-drill what you missed, and look up any question by its ID." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LightBluePrep" />
    <meta property="og:url" content="https://lightblueprep.pages.dev/" />
    <!-- The /skills pages link here with ?skill= and ?type=. Those are one page
         to a search engine, not hundreds of near copies. -->
    <link rel="canonical" href="https://lightblueprep.pages.dev/" />
    <meta property="og:title" content="LightBluePrep · Free SAT question bank" />
    <meta property="og:description"
          content="Every question in College Board's official SAT Question Bank, free. Filter by topic, hide the ones you've done, re-drill what you missed, and look up any question by its ID." />
    <meta property="og:image" content="https://lightblueprep.pages.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"
          content="LightBluePrep: every official SAT practice question, free." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Structured data for search engines: the site's name (so results can say
         "LightBluePrep" rather than the bare domain) and that it is a free web
         app. A data block, never executed, so the CSP's script-src does not
         apply. A fork on another domain edits these URLs too. -->
    <script type="application/ld+json">
      {"@context": "https://schema.org", "@graph": [
        {"@type": "WebSite", "name": "LightBluePrep", "url": "https://lightblueprep.pages.dev/"},
        {"@type": "WebApplication", "name": "LightBluePrep", "url": "https://lightblueprep.pages.dev/",
         "applicationCategory": "EducationalApplication", "operatingSystem": "Any",
         "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
         "description": "Every question in College Board's official SAT Question Bank, free. Filter by topic, hide the ones you've done, re-drill what you missed, and look up any question by its ID."}
      ]}
    </script>
    <!-- Tints the phone browser chrome (and the stripe down a Discord embed).
         The nav's own colour: white, or the dark theme's --surface, which the
         theme line below and lib/theme.ts set. Brand blue here painted a blue
         bar above a white header. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Light or dark before the first paint: Settings' choice, else the device's.
         Byte-identical in index.html, privacy.html, 404.html and the skill pages
         (scripts/skill_pages.py): its sha256 is in public/_headers. -->
    <script>(function(){var t;try{t=localStorage.getItem('lbp.theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);if(t==='dark'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#12171d')}})()</script>
    <!-- Noto is self-hosted in src/fonts, declared by src/fonts.css. It used to
         load from fonts.googleapis.com, which meant Google saw the IP of every
         visitor whether or not they ever signed in, and made the About page's
         privacy claim untrue. Do not put a font CDN back here. -->
    <script>
      // MathML in, SVG out: no font files to fetch, so it works offline.
      window.MathJax = {
        loader: { load: ['input/mml', 'output/svg'] },
        options: {
          enableMenu: false,
          // The bank ships alttext on every <math>; keep it for screen readers.
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        },
        startup: { typeset: false },
      };
    </script>
    <!-- MathJax itself (1.9 MB) is not loaded here. lib/mathjax.ts fetches it
         the first time a question has maths, or when Home is idle; as a
         deferred script here it held up the first paint of every page. The
         config above stays inline and unchanged: its hash is in _headers. -->
    <!-- The questions come straight from College Board. Opening that
         connection now saves its DNS and TLS round trips (about 0.9s on 3G)
         when the first question is fetched. crossorigin because those fetches
         are CORS requests, which use a separate connection. -->
    <link rel="preconnect" href="https://qbank-api.collegeboard.org" crossorigin />
    <link rel="dns-prefetch" href="https://saic.collegeboard.org" />
    <!-- The boot shell inside #root: what shows between the HTML arriving and
         React's first render, which replaces it. Neutral on purpose (no hero
         copy), so a deep link to a question does not flash Home. System fonts
         and inline, because neither the app's CSS nor its fonts are here yet. -->
    <style>
      .boot { min-height: 100vh; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-bar { padding-top: env(safe-area-inset-top); border-bottom: 1px solid #e4e8ed; }
      .boot-in, .boot-page { box-sizing: border-box; max-width: 1160px; margin: 0 auto; padding: 0 32px; }
      .boot-in { display: flex; align-items: center; gap: 10px; height: 63px; }
      .boot-word { font-size: 19px; font-weight: 800; letter-spacing: -.03em; color: #11151a; }
      .boot-word span { color: #1479c2; }
      .boot-page { padding-top: 48px; }
      .boot-line { height: 16px; margin-bottom: 16px; border-radius: 6px; background: #eef1f4; }
      .boot-line.boot-head { width: min(420px, 70%); height: 40px; margin-bottom: 24px; }
      .boot-line.boot-short { width: 40%; }
      .boot-line.boot-block { height: 120px; margin-top: 40px; border-radius: 12px; }
      /* The dark theme's --surface, --hair-1, --fg-1, --brand-700 and
         --surface-sunken, so a dark-mode visitor gets no white flash. The
         theme line in the head has set data-theme by now. */
      [data-theme=dark] .boot { background: #12171d; }
      [data-theme=dark] .boot-bar { border-bottom-color: #262e37; }
      [data-theme=dark] .boot-word { color: #e8ecf1; }
      [data-theme=dark] .boot-word span { color: #5cb0ec; }
      [data-theme=dark] .boot-line { background: #222a33; }
      @media (max-width: 819px) {
        .boot-in, .boot-page { padding: 0 16px; }
        .boot-in { gap: 8px; height: 51px; }
        .boot-in svg { width: 24px; height: 24px; }
        .boot-word { font-size: 18px; }
        .boot-page { padding-top: 32px; }
      }
    </style>
    <!-- Without JavaScript nothing replaces the shell; the <noscript> copy in
         the body says what the site is instead. -->
    <noscript><style>.boot { display: none; }</style></noscript>
  </head>
  <body>
    <!-- What a crawler, a link unfurler or a visitor with JavaScript off sees.
         No class, so no app stylesheet reaches it. -->
    <noscript>
      <div style="padding: 24px">
        <h1>LightBluePrep: free SAT question bank</h1>
        <p>Practice every question in College Board's official SAT Question Bank, free; the practice app needs JavaScript.</p>
        <ul>
          <li><a href="/skills/">Browse every SAT skill</a></li>
          <li><a href="/privacy">Privacy policy</a></li>
        </ul>
      </div>
    </noscript>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading LightBluePrep">
        <div class="boot-bar">
          <div class="boot-in">
            <svg width="28" height="28" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
              <rect x="2" y="2" width="44" height="44" rx="12" fill="#1479c2" />
              <path d="M14.5 24.5l6.5 6.5 12.5-13" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="boot-word" aria-hidden="true">Light<span>Blue</span>Prep</span>
          </div>
        </div>
        <div class="boot-page" aria-hidden="true">
          <div class="boot-line boot-head"></div>
          <div class="boot-line"></div>
          <div class="boot-line boot-short"></div>
          <div class="boot-line boot-block"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
